# Vultr VKE with Vultr VFS and an existing nginx ingress controller.
# Replace uppercase placeholders before deployment. The chart creates a
# release-specific PVC. Configure TCP forwarding separately; see README.md.

storage:
  createIfMissing: true
  claimName: ""
  retain: true
  claimSpec:
    storageClassName: vultr-vfs-storage
    accessModes:
      - ReadWriteMany
    resources:
      requests:
        storage: 10Gi
  permissions:
    enabled: true
    uid: 1000
    gid: 1000
    mode: "0770"

workerDeployment:
  replicaCount: 1
  sync:
    protocol: http

adminService:
  type: ClusterIP
  http:
    enabled: true
    port: 10019

workerService:
  type: ClusterIP
  sftpPort: 10022
  httpFiles:
    enabled: true
    port: 10080
  workerDebug:
    enabled: true
    port: 12019
    servicePort: 12020

# Web Manager: /admin; worker debug: /worker-admin (one worker only);
# Web Client: /. nginx terminates TLS for the HTTP backends.
ingress:
  host: YOUR_SFTPPLUS_HOST
  # Requires cert-manager and an existing ClusterIssuer.
  certificate:
    enabled: true
    secretName: YOUR_TLS_SECRET
    issuerRef:
      name: YOUR_CLUSTER_ISSUER
      kind: ClusterIssuer
  admin:
    enabled: true
    className: nginx
    path: /admin(/|$)(.*)
    pathType: ImplementationSpecific
    backendPort: manager-http
    workerDebug:
      enabled: true
      path: /worker-admin(/|$)(.*)
      pathType: ImplementationSpecific
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$2
  worker:
    enabled: true
    className: nginx
    path: /
    pathType: Prefix
    backendPort: http-files
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
