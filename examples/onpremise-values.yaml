# On-premises Kubernetes with an existing ingress controller and shared PVC.
# Replace uppercase placeholders before deployment. Use a storage class that
# supports ReadWriteMany so the controller and workers can run on any node.

storage:
  createIfMissing: true
  claimName: YOUR_PVC_NAME
  claimSpec:
    storageClassName: YOUR_STORAGE_CLASS
    accessModes:
      - ReadWriteMany
    resources:
      requests:
        storage: 1G

image:
  repository: YOUR_IMAGE_REPOSITORY
  tag: YOUR_IMAGE_TAG
  pullPolicy: Always

imagePullSecrets:
  - name: YOUR_IMAGE_PULL_SECRET

workerDeployment:
  replicaCount: 1
  sync:
    protocol: http
  # Optional: remove this and the Azure label below if workload identity is unused.
  serviceAccountName: YOUR_WORKLOAD_IDENTITY_SERVICE_ACCOUNT
  templateMetadata:
    labels:
      azure.workload.identity/use: "true"

adminDeployment:
  # Optional: remove this and the Azure label below if workload identity is unused.
  serviceAccountName: YOUR_WORKLOAD_IDENTITY_SERVICE_ACCOUNT
  templateMetadata:
    labels:
      azure.workload.identity/use: "true"

adminService:
  type: NodePort
  port: 10020
  nodePort: 30020
  http:
    enabled: true
    port: 10019

workerService:
  type: NodePort
  sftpPort: 10022
  httpsPort: 10443
  sftpNodePort: 30022
  httpFiles:
    enabled: true
    port: 10080
  workerDebug:
    enabled: true
    port: 12019
    servicePort: 12020

# Web Manager: /admin; worker debug: /worker-admin (one worker only);
# Web Client: /. Add access control to the admin routes for production.
ingress:
  host: YOUR_SFTPPLUS_HOST
  # Requires cert-manager and an existing ClusterIssuer.
  certificate:
    enabled: true
    secretName: YOUR_TLS_SECRET
    issuerRef:
      name: YOUR_CLUSTER_ISSUER
      kind: ClusterIssuer
  admin:
    enabled: true
    className: nginx
    path: /admin(/|$)(.*)
    pathType: ImplementationSpecific
    backendPort: manager-http
    workerDebug:
      enabled: true
      path: /worker-admin(/|$)(.*)
      pathType: ImplementationSpecific
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$2
  worker:
    enabled: true
    className: nginx
    path: /
    pathType: Prefix
    backendPort: http-files
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
