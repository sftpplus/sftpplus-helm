{{- $podLabels := include "sftpplus.podLabels" (dict "root" . "component" "admin") | fromYaml }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sftpplus.adminName" . }}
  labels:
    app.kubernetes.io/name: sftpplus
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: admin
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ index $podLabels "app.kubernetes.io/instance" | quote }}
      app.kubernetes.io/component: {{ index $podLabels "app.kubernetes.io/component" | quote }}
  template:
    metadata:
      labels:
{{ toYaml $podLabels | indent 8 }}
      annotations:
{{ include "sftpplus.podAnnotations" (dict "root" . "component" "admin") | indent 8 }}
    spec:
{{- with .Values.adminDeployment.serviceAccountName }}
      serviceAccountName: {{ . | quote }}
{{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
{{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- if .Values.storage.permissions.enabled }}
{{- $uid := toString .Values.storage.permissions.uid }}
{{- $gid := toString .Values.storage.permissions.gid }}
{{- $mode := toString .Values.storage.permissions.mode }}
{{- if not (regexMatch "^[0-9]+$" $uid) }}{{ fail "storage.permissions.uid must be a nonnegative integer" }}{{ end }}
{{- if not (regexMatch "^[0-9]+$" $gid) }}{{ fail "storage.permissions.gid must be a nonnegative integer" }}{{ end }}
{{- if not (regexMatch "^[0-7]{3,4}$" $mode) }}{{ fail "storage.permissions.mode must be a three- or four-digit octal mode" }}{{ end }}
      initContainers:
        - name: prepare-storage
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - {{ printf "chown %s:%s /opt/sftpplus-storage && chmod %s /opt/sftpplus-storage" $uid $gid $mode | quote }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: storage
              mountPath: /opt/sftpplus-storage
{{- end }}
      containers:
        - name: admin
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "/opt/sftpplus-initialization/admin-init.sh"]
          env:
            - name: SFTPPLUS_CONFIGURATION
              value: /opt/sftpplus-storage/configuration
          ports:
            - name: manager-https
              containerPort: 10020
              protocol: TCP
{{- if .Values.adminService.http.enabled }}
            - name: manager-http
              containerPort: {{ .Values.adminService.http.port }}
              protocol: TCP
{{- end }}
          volumeMounts:
            - name: storage
              mountPath: /opt/sftpplus-storage
            - name: initialization
              mountPath: /opt/sftpplus-initialization
              readOnly: true
            - name: worker-credentials
              mountPath: /opt/sftpplus-worker-credentials
              readOnly: true
            - name: admin-credentials
              mountPath: /opt/sftpplus-admin-credentials
              readOnly: true
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "sftpplus.storageClaimName" . | quote }}
        - name: initialization
          configMap:
            name: {{ include "sftpplus.fullname" . }}-initialization
        - name: worker-credentials
          secret:
            secretName: {{ include "sftpplus.fullname" . }}-worker-credentials
        - name: admin-credentials
          secret:
            secretName: {{ include "sftpplus.fullname" . }}-admin-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sftpplus.adminName" . }}
  labels:
    app.kubernetes.io/name: sftpplus
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: admin
{{- with .Values.adminService.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
spec:
  type: {{ .Values.adminService.type }}
{{- with .Values.adminService.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
{{ toYaml . | indent 4 }}
{{- end }}
{{- with .Values.adminService.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
{{- end }}
  selector:
    app.kubernetes.io/instance: {{ index $podLabels "app.kubernetes.io/instance" | quote }}
    app.kubernetes.io/component: {{ index $podLabels "app.kubernetes.io/component" | quote }}
  ports:
    - name: manager-https
      port: {{ .Values.adminService.port }}
{{- if and (eq .Values.adminService.type "NodePort") .Values.adminService.nodePort }}
      nodePort: {{ .Values.adminService.nodePort }}
{{- end }}
      targetPort: manager-https
      protocol: TCP

{{- if .Values.adminService.http.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sftpplus.adminHttpName" . }}
  labels:
    app.kubernetes.io/name: sftpplus
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: admin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ index $podLabels "app.kubernetes.io/instance" | quote }}
    app.kubernetes.io/component: {{ index $podLabels "app.kubernetes.io/component" | quote }}
  ports:
    - name: manager-http
      port: {{ .Values.adminService.http.port }}
      targetPort: manager-http
      protocol: TCP
{{- end }}
