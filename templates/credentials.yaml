apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sftpplus.fullname" . }}-worker-credentials
  labels:
    app.kubernetes.io/name: sftpplus
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  worker-password: {{ required "credentials.workerPassword is required" .Values.credentials.workerPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sftpplus.fullname" . }}-admin-credentials
  labels:
    app.kubernetes.io/name: sftpplus
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  admin-password: {{ required "credentials.adminPassword is required" .Values.credentials.adminPassword | quote }}
